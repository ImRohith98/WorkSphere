<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">

  <defs>
    <!-- Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#41D1FF"/>
      <stop offset="100%" stop-color="#BD34FE"/>
    </linearGradient>
  </defs>

  <!-- Full White Background -->

  <!-- Gradient Circle -->
  <circle cx="128" cy="128" r="125" fill="url(#bgGradient)"/>

  <!-- Dark Inner Circle -->
  <circle cx="128" cy="128" r="165" fill="#000"/>

  <!-- Bold W -->
  <text x="128"
        y="175"
        text-anchor="middle"
        font-family="'Comic Sans MS', 'Comic Sans', cursive"
        font-size="160"
        font-weight="900"
        fill="url(#bgGradient)">
    W
  </text>

</svg>
